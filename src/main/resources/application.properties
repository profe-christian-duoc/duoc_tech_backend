spring.application.name=demo
# URL de conexión (cambia 'mi_base_datos' por el nombre real de tu esquema)
spring.datasource.url=jdbc:mysql://localhost:3306/duoc_tech

# Credenciales de tu servidor MySQL
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL (Spring Boot suele detectarlo automáticamente, pero es buena práctica indicarlo)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Ruta de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html